name: Validate Azure NSG lab

on:
  pull_request:
    paths:
      - 'lab/incident/**'
      - '.github/workflows/validate-nsg-lab.yml'
  push:
    branches: [main]
    paths:
      - 'lab/incident/**'
      - '.github/workflows/validate-nsg-lab.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 lab/incident/manage.py check
